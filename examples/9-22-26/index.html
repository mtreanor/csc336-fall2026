<html>
    <head>
        <title>9-22-26</title>
        <style>
            #root {
                width: 100%;
            }

            .pokemonData {
                display: flex;
                justify-content: space-between;
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <script>
            // This array will be used to hold all of the information about pokemon that 
            // we want to display.
            let allPokemon = [];

            // Two ways to build an object - both end up the same, pick whichever reads better to you
            // Dot notation version - make an empty object, then fill in properties one at a time
            let pokemon = {};
            pokemon.name = "pikachu";
            pokemon.description = "the lightning one."
            pokemon.img = "https://img.pokemondb.net/sprites/ruby-sapphire/normal/pikachu.png";
            allPokemon.push(pokemon);

            // Object literal version, built and pushed all at once
            allPokemon.push({
                name: "shroodle",
                description: "Though usually a mellow Pokémon, it will sink its sharp, poison-soaked front teeth into any that anger it, causing paralysis in the object of its ire.",
                img: "https://img.pokemondb.net/sprites/scarlet-violet/normal/shroodle.png"
            });

            // Takes one pokemon object and builds the DOM for it by hand.
            // Note: there are better ways to do this, but we are going to do it this way for now.
            function addPokemonToRoot(pokemon) {
                // Find the div we already put in the HTML and grab a reference to it
                let rootDiv = document.querySelector("#root");

                // Wrapper div for this one pokemon's card
                let pokemonDiv = document.createElement("div");
                pokemonDiv.classList.add("pokemonData");

                // Name + description live together in their own div so flexbox
                // can put the image off to the side
                let infoDiv = document.createElement("div");

                // h1 for the name - not semantically perfect since we'll have
                // more than one on the page, but fine for this example
                let nameHeading = document.createElement("h1");
                nameHeading.innerHTML = pokemon.name;
                infoDiv.append(nameHeading);

                let descriptionParagraph = document.createElement("p");
                descriptionParagraph.innerHTML = pokemon.description;
                infoDiv.append(descriptionParagraph);

                pokemonDiv.append(infoDiv);

                // Image element just needs a src set, same as the img tag in HTML
                let imageElement = document.createElement("img");
                imageElement.src = pokemon.img;
                pokemonDiv.append(imageElement);

                // Last step - actually attach it, nothing shows up until this happens
                rootDiv.append(pokemonDiv);
            }

            // Calling it once per pokemon for now, we'll loop this once there's more than two
            addPokemonToRoot(allPokemon[0]);
            addPokemonToRoot(allPokemon[1]);

        </script>
    </body>
</html>
